<div id="banner" lang="en-Latn">
  <div class="downloads">
    {%- for my_page in site.pages -%}
      {%- if my_page.title -%}
        <span><a href="{{ my_page.url | relative_url }}">{{ my_page.title | escape }}</a></span>
      {%- endif -%}
    {%- endfor -%}
  </div>
  <fieldset id="script-pickers" hidden>
    <label for="select-cls">Script for Sanskrit:</label>
    <select id="select-cls" autocomplete="off" lang="mul" data-no-transliterate>
      <option value="" lang="zxx" selected>—</option>
      <option value="Deva" lang="cls-Deva">देवनागरी</option>
      <option value="Gran" lang="cls-Gran">𑌗𑍍𑌰𑌨𑍍𑌥𑌃</option>
      <option value="Latn" lang="en-Latn">Latin</option>
    </select>
    <label for="select-ta">Script for Tamil:</label>
    <select id="select-ta" autocomplete="off" lang="mul" data-no-transliterate>
      <option value="" lang="zxx" selected>—</option>
      <option value="Knda" lang="kn-Knda">ಕನ್ನಡ</option>
      <option value="Latn" lang="en-Latn">Latin</option>
      <option value="Mlym" lang="ml-Mlym">മലയാളം</option>
      <option value="Taml" lang="ta-Taml">தமிழ்</option>
      <option value="Telu" lang="te-Telu">తెలుగు</option>
    </select>
    <label for="select-spelling">Tamil spelling:</label>
    <select id="select-spelling" autocomplete="off" data-no-transliterate>
      <option value="trad">traditional</option>
      <option value="modn" selected>modern</option>
    </select>
  </fieldset>

  <script src="{{ '/assets/js/banner.js' | relative_url }}" type="module"></script>
</div>
